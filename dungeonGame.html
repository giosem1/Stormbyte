<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Strombyte.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Game</title>
  <link rel="stylesheet" href="./src/styles/createdungeon.css" type="text/css">
  <link rel="stylesheet" href="./src/styles/dungeongame.css" type="text/css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <script type="module" src="src/typescript/game.ts"></script>

  <div id="overlay" class="hidden"></div>
    <div id="generic-panel" class="hidden">
      <div id="panel-content" class=" p-6 rounded-lg"></div>
    </div>
  
  <div id="chat-toggle-btn">
    <span id="chat-badge" class="hidden">0</span>
  </div>
  <div id="chat-box" class="hidden">
    <div id="messages">
    </div>

    <div id="chat-input-wrapper">
      <div class="input-container">
        <input type="text" id="message" placeholder="Say something" autocomplete="off"/>
        <div id="send-btn"></div>
      </div>
    </div>
  </div>  

    <div id="panel-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>
</body>
</html>
