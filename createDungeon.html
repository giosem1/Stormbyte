<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Strombyte.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Create Dungeon</title>
  <link rel="stylesheet" href="./src/styles/createdungeon.css" type="text/css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="commands">
    <div id="left-controls">
      <p id="back-arrow">&lt;-</p>
      <p id="save">Save</p>
      <p id="code-label">Codice:</p>
      <div id="panel" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div id="panel-content" class=" p-6 rounded-lg"></div>
      </div>

      <div id="panel-overlay" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>
      <p id="sent-label">Invite</p>

    </div>
    
    <div id="center-controls">
      <p id="nameDungeon">Name</p>
      <div id="name-input-wrapper">
        <input id="dungeon-name-input" type="text" autocomplete="off"/>
      </div>
    </div>
  </div>
  <div id="viewport">
    <div id="canvas-center">
      <div id="infinite-canvas">
        <div class="room-wrapper">
          <img id="loginroom" class="room room-static" src="public/assets/rooms/loginroom.png" />
        </div>
      </div>
    </div>
  </div>

  <div class="dungeon-menu fixed bottom-0 left-0 w-full bg-black/60 backdrop-blur-md text-white font-sans p-4 border-t border-white/10">
    <div class="flex items-center justify-center space-x-6 border-b border-white/20 pb-2 mb-3">
      <button id="rooms" class="menu-btn active">Rooms</button>
      <button id="enemies" class="menu-btn">Enemis</button>
      <button id="traps" class="menu-btn">Traps</button>
    </div>

    <div id="itemsContainer" class="flex gap-2"></div>
  </div>

  <div id="chat-box">
    <div id="messages">
    </div>

    <div id="chat-input-wrapper">
      <div class="input-container">
        <input type="text" id="message" placeholder="Say something" autocomplete="off"/>
        <div id="send-btn"></div>
      </div>
    </div>
  </div>  
  <script type="module">
    import { initDungeonEditor } from './src/typescript/createDun/createdungeon.ts';
    initDungeonEditor();
  </script>
  
</body>
</html>
